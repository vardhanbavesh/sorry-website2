<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Am Sorry</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap');

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;

    background: linear-gradient(135deg, #fff1f4, #ffffff, #ffe8ee);

    overflow: hidden;
}

.message {
    text-align: center;

    font-family: 'Dancing Script', cursive;

    font-size: 18vw;

    font-weight: 700;

    color: #8b3048;

    animation: showMessage 2.5s ease forwards;
}

.heart {
    display: block;

    font-family: Arial, sans-serif;

    font-size: 8vw;

    margin-top: 10px;

    animation: heart 2s ease 1.5s both;
}

@keyframes showMessage {

    0% {
        opacity: 0;
        transform: scale(0.5);
    }

    70% {
        opacity: 1;
        transform: scale(1.08);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}

@keyframes heart {

    0% {
        opacity: 0;
        transform: scale(0);
    }

    70% {
        opacity: 1;
        transform: scale(1.2);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}

</style>
</head>

<body>

<div class="message">
    I am sorry
    <span class="heart">♥</span>
</div>

</body>
</html>
